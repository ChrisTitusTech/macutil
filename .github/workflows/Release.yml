name: macutil Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_app:
    # macOS runner: lipo, codesign and ditto are required to build a .app bundle.
    runs-on: macos-latest

    env:
      # `secrets` cannot be used in a step-level `if:`, so surface them here and
      # test the environment variable instead (empty when the secrets are unset).
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache .NET packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore MacUtilGUI/MacUtilGUI.fsproj

      # Optional: forks can stay unsigned (ad-hoc) and still ship working apps.
      # Add these repository secrets to produce a Developer ID signed build:
      #   MACOS_CERT_P12, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
      - name: Import Developer ID certificate (optional)
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          old_keychains="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086 # the list is intentionally word-split
          security list-keychains -d user -s "$KEYCHAIN" $old_keychains
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Signing identity: ${MACOS_SIGN_IDENTITY:-<unset, using ad-hoc>}"

      - name: Extract Version
        id: extract_version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Tag push: release exactly the pushed tag.
            version="${GITHUB_REF_NAME#v}"
          else
            # Manual run: bump the minor version of the latest tag.
            git fetch --tags

            latest_tag=$(git tag --sort=-version:refname | head -n1)
            if [ -z "$latest_tag" ]; then
              latest_tag="0.0.0"
            fi

            # Parse the latest tag (assuming format X.Y.Z)
            IFS='.' read -ra VERSION_PARTS <<< "${latest_tag#v}"
            major=${VERSION_PARTS[0]:-0}
            minor=${VERSION_PARTS[1]:-0}

            version="${major}.$((minor + 1)).0"
            echo "Previous version: $latest_tag"
          fi

          echo "New version: $version"
          echo "version=$version" >> "$GITHUB_ENV"
        shell: bash

      - name: Build universal .app bundle
        env:
          VERSION: ${{ env.version }}
        run: |
          chmod +x MacUtilGUI/packaging/build_app.sh
          MacUtilGUI/packaging/build_app.sh --universal

      - name: Show bundle contents
        run: |
          lipo -info MacUtilGUI/dist/MacUtil-Universal.app/Contents/MacOS/MacUtilGUI
          codesign -dv MacUtilGUI/dist/MacUtil-Universal.app 2>&1 | head -10
          ls -lh MacUtilGUI/dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macutil-macos-universal
          path: MacUtilGUI/dist/*.zip
          if-no-files-found: error

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          name: Pre-Release ${{ env.version }}
          body: |
            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.version }}/MacUtil-Universal.zip)

            > [!NOTE]
            > This build is ad-hoc signed unless the repository provides a
            > Developer ID certificate. macOS blocks it on first launch:
            > right click the app and choose **Open**, or run
            > `xattr -dr com.apple.quarantine /Applications/MacUtil-Universal.app`
          append_body: true
          generate_release_notes: true
          files: |
            MacUtilGUI/dist/MacUtil-Universal.zip
          prerelease: true
        env:
          version: ${{ env.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
